<svg xmlns="http://www.w3.org/2000/svg" viewBox="-107.00 -107.00 214.00 385.11" role="img" aria-label="Sisters of Sonder">
<defs>
  <clipPath id="drop"><circle r="32.000"/></clipPath>
  <!-- a prism throw: the spectrum, softly blended -->
  <linearGradient id="prism" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e5484d" stop-opacity="0"/>
    <stop offset=".12" stop-color="#e5484d"/>
    <stop offset=".3" stop-color="#f5a524"/>
    <stop offset=".45" stop-color="#f2dc4a"/>
    <stop offset=".6" stop-color="#46b97a"/>
    <stop offset=".75" stop-color="#3b8fe0"/>
    <stop offset=".9" stop-color="#8a5cd6"/>
    <stop offset="1" stop-color="#8a5cd6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".3" stop-color="#fff"/>
    <stop offset=".7" stop-color="#fff"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="1.600"/>
  </filter>
  <mask id="prism-fade" maskContentUnits="objectBoundingBox">
    <rect width="1" height="1" fill="url(#fade)"/>
  </mask>
  <!-- clear water: shaded at the top, light gathered at the bottom -->
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfc8ba"/>
    <stop offset=".55" stop-color="#efebe2"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
</defs>
<circle r="96.500" fill="#fbf6ea"/>
<circle r="96.500" fill="none" stroke="#b8893a" stroke-width="7.000"/>
<circle r="93.000" fill="none" stroke="#e8cf98" stroke-width="1.260"/>
<rect x="-58.779" y="80.902" width="117.557" height="190.211" fill="#8a4b55" stroke="#b8893a" stroke-width="4.500"/>
<rect x="-50.550" y="93.631" width="101.099" height="169.253" fill="none" stroke="#e8cf98" stroke-width="1.260"/>
<polygon points="0.000,-100.000 95.106,-30.902 58.779,80.902 -58.779,80.902 -95.106,-30.902" fill="none" stroke="#1c1a2e" stroke-width="4.500" stroke-linejoin="miter"/>
<polygon points="58.779,-80.902 95.106,30.902 0.000,100.000 -95.106,30.902 -58.779,-80.902" fill="none" stroke="#1c1a2e" stroke-width="4.500" stroke-linejoin="miter"/>
<polygon points="0.000,-66.000 62.770,-20.395 38.794,53.395 -38.794,53.395 -62.770,-20.395" fill="none" stroke="#1c1a2e" stroke-width="2.970" stroke-linejoin="miter"/>
<polygon points="38.794,-53.395 62.770,20.395 0.000,66.000 -62.770,20.395 -38.794,-53.395" fill="none" stroke="#1c1a2e" stroke-width="2.970" stroke-linejoin="miter"/>
<polygon points="0.000,-48.314 45.950,-14.930 28.398,39.087 -28.398,39.087 -45.950,-14.930" fill="none" stroke="#1c1a2e" stroke-width="2.174" stroke-linejoin="miter"/>
<polygon points="28.398,-39.087 45.950,14.930 0.000,48.314 -45.950,14.930 -28.398,-39.087" fill="none" stroke="#1c1a2e" stroke-width="2.174" stroke-linejoin="miter"/>
<circle r="32.000" fill="url(#water)"/>
<g clip-path="url(#drop)"><rect x="-35.200" y="3.840" width="70.400" height="16.000" fill="url(#prism)" mask="url(#prism-fade)" filter="url(#soft)" transform="rotate(-14)" opacity=".6"/></g>
<circle r="35.000" fill="none" stroke="#1c1a2e" stroke-width="6.000"/>
<circle cx="0.000" cy="-16.000" r="3.200" fill="#ffffff"/>
</svg>
